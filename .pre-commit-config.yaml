repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    # GitLab's !reference tag is not plain YAML. This only skips the check that
    # every tag is a known type, a syntax error is still caught.
    args: [--unsafe]
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/psf/black
  rev: 26.10.0
  hooks:
  - id: black

- repo: https://github.com/opensource-nepal/commitlint
  rev: v2.0.0
  hooks:
    - id: commitlint
