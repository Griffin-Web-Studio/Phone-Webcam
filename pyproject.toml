[project]
name = "phone-webcam"
version = "0.0.0"
description = "Use an Android phone's camera as a webcam"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pywebview[qt]>=6.2.1",
]

[project.optional-dependencies]
dev = [
  "black>=26.3.0",
  "pre-commit>=4.5.1",
  "commitizen>=4.16.3",
  "Pillow>=11.0.0",
  "CairoSVG>=2.7.1",
  "pytest>=8",
  "pytest-cov>=7.1.0",
  "pyyaml>=6.0.3",
]
build = [
    "nuitka>=4.2.2",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["phone_webcam"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.black]
line-length = 80
exclude = '''
/(
    \.venv
  | \.git
)/
'''

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
version_scheme = "semver2"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
changelog_merge_prerelease = true
version_files = [
  "pyproject.toml:^version",
  # The version shown in the README's title and its release link.
  "README.md:^# Phone Webcam",
  "README.md:releases/v",
]
# Runs after pyproject.toml's version is written but before the release
# commit is created, so `uv lock` picks up the new version and the
# refreshed uv.lock lands in the same commit - not a separate manual
# follow-up bump like `bump(self): bump self version in uv lock`.
pre_bump_hooks = [
  "uv lock",
  "git add uv.lock",
]

[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
perf = "Performance Improvements"
refactor = "Refactoring"
